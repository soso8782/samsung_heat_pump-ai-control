name: testy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Aplikácia beží v slovenskom čase; testy nech majú rovnaké pásmo ako server.
      TZ: Europe/Bratislava
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kompilácia všetkých sledovaných .py súborov
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Testy test_*.py v koreňovom priečinku
        run: |
          failed=()
          for t in test_*.py; do
            echo "::group::$t"
            if python -X utf8 "$t"; then
              echo "OK: $t"
            else
              echo "::error::FAIL: $t"
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Zlyhané testy: ${failed[*]}"
            exit 1
          fi
          echo "Všetky testy prešli."

      # tests_ha/ používa len stdlib (unittest) a model.py bez Home Assistanta,
      # preto ho spúšťame aj v CI.
      - name: Testy tests_ha/ (unittest)
        run: python -X utf8 -m unittest discover -s tests_ha -v

  javascript:
    name: javascript (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax inline skriptov a stats_ui.js / sw.js
        run: node .github/scripts/js_syntax.mjs

  # Skutočný prehliadač: app.py nad dočasnou inštaláciou (DRY_RUN, mŕtve ESP/HA, syntetické DB), prihlásenie a prechod
  # všetkými záložkami vrátane Štatistík. Zachytí chyby, ktoré syntaktická kontrola nevidí (napr. duplicitné const po merge).
  prehliadac:
    name: prehliadac (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Bratislava
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Playwright (Chromium)
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Duplicitné deklarácie v JS (bez prehliadača)
        run: python -X utf8 test_js_deklaracie.py

      - name: Smoke test webu v prehliadači
        run: |
          set +e
          python -X utf8 tests_ui/test_prehliadac.py -v > vystup.txt 2>&1
          rc=$?
          cat vystup.txt
          if [ $rc -ne 0 ]; then
            # chyby ako anotácie (čitateľné cez verejné API aj bez prihlásenia)
            python - <<'PY'
          import re
          t = open("vystup.txt", encoding="utf-8", errors="replace").read()
          bloky = re.split(r"\n(?====+\n(?:FAIL|ERROR):)", t)
          n = 0
          for b in bloky:
              m = re.search(r"(FAIL|ERROR): (\S+)", b)
              if not m or n >= 10:
                  continue
              n += 1
              msg = b.strip()[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=%s %s::%s" % (m.group(1), m.group(2), msg))
          if n == 0:
              print("::error title=test_prehliadac::" + t.strip()[-3500:].replace("%", "%25").replace("\n", "%0A"))
          PY
          fi
          exit $rc
