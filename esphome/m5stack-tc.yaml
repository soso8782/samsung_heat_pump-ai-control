  # Ak jednotka (gen. J, 2018) niektorú správu neposiela, senzor ostane "unknown".
  - platform: samsung_nasa
    nasa_device_id: indoor_unit
    name: "Otáčky obehového čerpadla (PWM)"
    web_server:
      sorting_group_id: g_diag
      sorting_weight: 3
    message: 0x40C4
 
  - platform: template
    name: "Delta T vykurovacej vody"
    web_server:
      sorting_group_id: g_teploty
      sorting_weight: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!isnan(id(tw2_temp).state) && !isnan(id(tw1_temp).state)) {
        return id(tw2_temp).state - id(tw1_temp).state;
      }
      return NAN;
 
  - platform: template
    name: "Odhadovaný príkon TČ"
    web_server:
      sorting_group_id: g_spotreba
      sorting_weight: 1
    id: estimated_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!isnan(id(tc_current).state) && id(tc_current).state > 0.2) {
        return (id(tc_current).state * 230.0 * 3.0 * 0.90) + 60.0;
      }
      if (!isnan(id(tc_freq).state) && id(tc_freq).state > 5.0) {
        return (id(tc_freq).state * 42.0) + 80.0;
      }
      return 15.0;
 
  - platform: total_daily_energy
    name: "Denná spotreba TČ"
    web_server:
      sorting_group_id: g_spotreba
      sorting_weight: 2
    power_id: estimated_power
    unit_of_measurement: "kWh"
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
 