#########################################################################
# VÝBER REŽIMOV
#########################################################################
select:
  # Ktorú krivku TČ používa: WL1 (FSV 2021/2022) alebo WL2 (FSV 2031/2032)
  - platform: samsung_nasa
    nasa_device_id: indoor_unit
    fsv: 2041
    id: fsv_2041
    name: "FSV 2041 Typ krivky WL1 alebo WL2"
    entity_category: config
    web_server:
      sorting_group_id: g_krivka
      sorting_weight: 1

  # Ako sa berie do úvahy teplota v detskej izbe
  - platform: template
    name: "Režim izbovej regulácie"
    web_server:
      sorting_group_id: g_izba
      sorting_weight: 1
    id: izba_rezim
    options:
      - "Vypnutá"
      - "Posun krivky"
      - "Vypínanie kúrenia"
    initial_option: "Posun krivky"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            // Pri odchode z režimu upratať po ňom, aby nič nezostalo "visieť"
            if (i != 1) id(posun_i) = NAN;
            if (i != 1 && !isnan(id(wl_posun).state) && fabsf(id(wl_posun).state) > 0.05f) {
              ESP_LOGI("izba", "Režim zmenený - vraciam posun krivky na 0");
              auto call = id(wl_posun).make_call();
              call.set_value(0.0f);
              call.perform();
            }
            if (i != 2 && id(regulacia_vypla_kurenie)) {
              id(regulacia_vypla_kurenie) = false;
              if (id(bolo_vypnute_blokovanim)) {
                id(kurenie_bolo_zapnute) = true;   // zapne sa po skončení tarify
              } else {
                ESP_LOGI("izba", "Režim zmenený - zapínam kúrenie vypnuté reguláciou");
                id(sw_kurenie).turn_on();
              }
            }

  # Podľa ktorého čidla beží izbová regulácia. Aplikácia mapuje možnosť na izbu podľa názvu:
  # „<názov izby>“ alebo „<názov izby> (<čidlo>)“ – izba s viacerými čidlami má viac možností.
  # PORADIE MOŽNOSTÍ zodpovedá skriptu riadiaca_nastav (index), pri zmene upravte oboje.
  - platform: template
    name: "Riadiaca izba"
    id: riadiaca_izba
    web_server:
      sorting_group_id: g_izba
      sorting_weight: 1.5
    options:
      - "Detská (ESPresense)"
      - "Detská (Zigbee)"
      - "Jedáleň"
      - "Jedáleň (hlavica)"
      - "Kuchyňa"
      - "Obývačka"
      - "Spálňa"
      - "Pracovňa"
      - "Kúpeľňa"
    initial_option: "Detská (ESPresense)"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: riadiaca_nastav

  - platform: samsung_nasa
    nasa_device_id: indoor_unit
    name: "Režim kúrenia"
    web_server:
      sorting_group_id: g_tc
      sorting_weight: 4
    message: 0x4001
 
  - platform: samsung_nasa
    nasa_device_id: indoor_unit
    name: "Režim TÚV"
    web_server:
      sorting_group_id: g_tc
      sorting_weight: 5
    message: 0x4066
 
  - platform: samsung_nasa
    nasa_device_id: indoor_unit
    name: "Rýchly ohrev TÚV (Boost)"
    web_server:
      sorting_group_id: g_tc
      sorting_weight: 6
    message: 0x406F
 
script:
  # Nastaví zdroj teploty riadiacej izby podľa selectu „Riadiaca izba“ (pri štarte aj pri zmene).
  - id: riadiaca_nastav
    mode: restart
    then:
      - lambda: |-
          auto idx = id(riadiaca_izba).active_index();
          esphome::sensor::Sensor *s = id(detska_teplota);
          if (idx.has_value()) {
            switch (*idx) {
              case 1: s = id(izba_detska_zigbee); break;
              case 2: s = id(izba_jedalen); break;
              case 3: s = id(izba_jedalen_hlavica); break;
              case 4: s = id(izba_kuchyna); break;
              case 5: s = id(izba_obyvacka); break;
              case 6: s = id(izba_spalna); break;
              case 7: s = id(izba_pracovna); break;
              case 8: s = id(izba_kupelna); break;
              default: break;
            }
          }
          bool zmena = id(riadiaca_zdroj) != s;
          id(riadiaca_zdroj) = s;
          // HA posiela hodnotu len pri zmene: posledná známa hodnota nového zdroja platí ako čerstvá
          if (zmena) id(riadiaca_posledna_aktualizacia) = (s->has_state() && !isnan(s->state)) ? millis() : 0;
          id(sledovana_teplota_web).publish_state(s->has_state() ? s->state : NAN);
          ESP_LOGI("izba", "Riadiaca izba: možnosť %d", idx.has_value() ? (int) *idx : -1);

