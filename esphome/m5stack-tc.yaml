# Overená konfigurácia ESPHome mosta (M5Stack Atom + RS485 na NASA zbernici) z referenčnej inštalácie
# Samsung EHS Split AE120JXEDGH + hydrobox AE160JNYDGH (gen. J, 2018). Názvy entít zodpovedajú predvolenému profilu.
# Heslá a kľúče sú v secrets.yaml (!secret), entity Home Assistant (izbové senzory) si prepíšte na svoje.

substitutions:
  # verzia firmvéru: web ju porovná s major.minor súboru VERSION; pri zmene konfigurácie, ktorú web potrebuje, ju zvýš
  fw_verzia: "2.12.0"

esphome:
  name: m5stack-tc
  friendly_name: m5stack-tc
  on_boot:
    priority: -100
    then:
      - script.execute: riadiaca_nastav

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: g_izba
      name: "Izbová regulácia"
      sorting_weight: 10
    - id: g_plan
      name: "Časový plán izby"
      sorting_weight: 20
    - id: g_nastav
      name: "Nastavenia regulácie"
      sorting_weight: 30
    - id: g_krivka
      name: "Ekvitermická krivka v TČ (FSV)"
      sorting_weight: 35
    - id: g_tc
      name: "Ovládanie TČ"
      sorting_weight: 40
    - id: g_teploty
      name: "Teploty vody a vonku"
      sorting_weight: 50
    - id: g_tarifa
      name: "Drahá tarifa"
      sorting_weight: 60
    - id: g_spotreba
      name: "Príkon a spotreba"
      sorting_weight: 70
    - id: g_izby
      name: "Teploty izieb (z HA)"
      sorting_weight: 75
    - id: g_diag
      name: "Diagnostika"
      sorting_weight: 80

logger:
  level: INFO

api:
  encryption:
    key: !secret m5stack_tc_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.199   # IP adresa ESP vo vašej sieti (ESP_URL v config.env)
  # Záchranný hotspot: ak sa ESP 1 minútu nevie pripojiť na Wi-Fi, spustí vlastnú sieť.
  # Pripojte sa naň mobilom a na http://192.168.4.1 zadajte novú Wi-Fi (captive portal).
  ap:
    ssid: "m5stack-tc zachrana"
    password: !secret m5stack_tc_ap_password

captive_portal:


#########################################################################
# PREMENNÉ NA ZAPAMÄTANIE STAVU PRED VYPNUTÍM
#########################################################################
globals:
  - id: kurenie_bolo_zapnute
    type: bool
    restore_value: true
    initial_value: 'true'
 
  - id: tuv_bolo_zapnute
    type: bool
    restore_value: true
    initial_value: 'true'
 
  # restore_value: true -> po reštarte počas drahej tarify sa kúrenie správne obnoví
  - id: bolo_vypnute_blokovanim
    type: bool
    restore_value: true
    initial_value: 'false'
 
  # true = kúrenie vypla izbová regulácia (režim Vypínanie kúrenia) a ona ho aj zapne
  - id: regulacia_vypla_kurenie
    type: bool
    restore_value: true
    initial_value: 'false'

  # sledovanie poslednej zmeny vypínača kúrenia (pre minimálny chod/pauzu)
  - id: kurenie_posledny_stav
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: kurenie_posledna_zmena
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # aktuálne platná cieľová teplota izby (z plánu alebo pevná)
  - id: izba_aktualny_ciel
    type: float
    restore_value: false
    initial_value: 'NAN'

  # pomalé doťahovanie posunu krivky (integračná časť), NAN = nadviazať na aktuálny posun
  - id: posun_i
    type: float
    restore_value: true
    initial_value: 'NAN'

  - id: posun_i_cas
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # čas posledného zápisu posunu krivky (obmedzenie na 1 zmenu za 10 min)
  - id: posun_posledny_zapis
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # čas poslednej aktualizácie teploty riadiacej izby (ms od štartu); 0 = ešte neprišla
  - id: riadiaca_posledna_aktualizacia
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # senzor, podľa ktorého beží izbová regulácia (nastavuje ho select „Riadiaca izba“ cez skript riadiaca_nastav)
  - id: riadiaca_zdroj
    type: esphome::sensor::Sensor*
    restore_value: false
    initial_value: 'nullptr'
 
#########################################################################
# ČASOVÁ LOGIKA (TARIFY + BEZPEČNÁ KONTROLA TEPLOTY V IZBE)
#########################################################################
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Bratislava"

  - platform: sntp
    id: sntp_time
    timezone: "Europe/Bratislava"

# Hlavná logika beží každú minútu cez interval - NEZÁVISLE od platného času.
# Bez času (HA aj SNTP nedostupné) sa vynechá iba tarifa a časový plán,
# poistky izbovej regulácie (posun 0 / zapnúť kúrenie) bežia ďalej.
interval:
  - interval: 1min
    then:
          - lambda: |-
              // --- ŠTART: počkať, kým NASA pošle skutočné stavy (inak sw_kurenie = false) ---
              if (millis() < 120000UL || !id(tw2_temp).has_state()) return;

              auto time = id(homeassistant_time).now();
              if (!time.is_valid()) time = id(sntp_time).now();
              bool cas_ok = time.is_valid();
              int h = time.hour;

              // --- 0. SLEDOVANIE ZMIEN VYPÍNAČA KÚRENIA (ručne, tarifou aj reguláciou) ---
              bool kurenie_on = id(sw_kurenie).state;
              static bool init_stav = false;
              if (!init_stav) {
                // prvý beh po štarte: prevziať stav bez započítania ako "zmena"
                init_stav = true;
                id(kurenie_posledny_stav) = kurenie_on;
              }
              if (kurenie_on != id(kurenie_posledny_stav)) {
                id(kurenie_posledny_stav) = kurenie_on;
                id(kurenie_posledna_zmena) = millis();
                // Kúrenie zapnuté ručne počas pauzy regulácie -> regulácia to rešpektuje
                if (kurenie_on && id(regulacia_vypla_kurenie)) {
                  ESP_LOGI("izba", "Kúrenie zapnuté mimo regulácie - preberám nový stav");
                  id(regulacia_vypla_kurenie) = false;
                }
              }

              // --- 1. LOGIKA DRAHEJ TARIFY (podľa okna, nie len presnej minúty) ---
              int r_start = (int) id(tarifa_ranny_zaciatok).state;
              int r_end   = (int) id(tarifa_ranny_koniec).state;
              int v_start = (int) id(tarifa_vecerny_zaciatok).state;
              int v_end   = (int) id(tarifa_vecerny_koniec).state;
 
              // okno môže ísť aj cez polnoc (napr. 22 -> 2)
              auto v_intervale = [](int hh, int s, int e) {
                return s <= e ? (hh >= s && hh < e) : (hh >= s || hh < e);
              };
              // Bez platného času sa okno neuplatní; ak bolo kúrenie vypnuté tarifou
              // (napr. reštart počas tarify), po 10 min bez času sa radšej obnoví.
              bool v_okne = cas_ok && id(tariff_block_enable).state &&
                            (v_intervale(h, r_start, r_end) || v_intervale(h, v_start, v_end));
              if (!cas_ok && id(bolo_vypnute_blokovanim) && millis() < 10UL * 60UL * 1000UL) {
                v_okne = true;   // krátko po štarte ešte čakať na čas, stav sa drží
              }

              if (v_okne && !id(bolo_vypnute_blokovanim)) {
                ESP_LOGI("tarifa", "Začiatok drahej tarify - vypínam kúrenie a TÚV");
                id(kurenie_bolo_zapnute) = id(sw_kurenie).state;
                id(tuv_bolo_zapnute) = id(sw_tuv).state;
                id(bolo_vypnute_blokovanim) = true;
                if (id(sw_kurenie).state) { id(sw_kurenie).turn_off(); }
                if (id(sw_tuv).state) { id(sw_tuv).turn_off(); }
              } else if (!v_okne && id(bolo_vypnute_blokovanim)) {
                if (cas_ok) ESP_LOGI("tarifa", "Koniec drahej tarify - obnovujem stav");
                else ESP_LOGW("tarifa", "Nie je platný čas - ukončujem blokovanie tarify (poistka)");
                id(bolo_vypnute_blokovanim) = false;
                if (id(kurenie_bolo_zapnute)) { id(sw_kurenie).turn_on(); }
                if (id(tuv_bolo_zapnute)) { id(sw_tuv).turn_on(); }
              }
              // Ručné zapnutie počas okna sa už neprepíše - vypína sa iba raz pri vstupe do okna.
              // Ak kúrenie pred tarifou vypla regulácia, kurenie_bolo_zapnute = false,
              // takže ho tarifa na konci nezapne a riadenie prevezme znova regulácia.

              // --- 2. IZBOVÁ REGULÁCIA (riadiaca izba podľa selectu „Riadiaca izba“) ---
              // Režimy: 0 = Vypnutá (izba sa ignoruje), 1 = Posun krivky, 2 = Vypínanie kúrenia
              auto rezim_opt = id(izba_rezim).active_index();
              size_t rezim = rezim_opt.has_value() ? *rezim_opt : 0;

              // --- Cieľová teplota: časový plán alebo pevná hodnota ---
              // Aktívne pásmo = to s najneskorším začiatkom <= teraz; pred prvým
              // pásmom dňa platí posledné pásmo z predošlého dňa (typicky Noc).
              float ciel, zapnutie;
              const char *pasmo;
              if (id(plan_aktivny).state && cas_ok) {
                datetime::TimeEntity *zac[4] = {id(plan_noc_zac), id(plan_rano_zac),
                                                id(plan_den_zac), id(plan_vecer_zac)};
                number::Number *tep[4] = {id(plan_noc_tep), id(plan_rano_tep),
                                          id(plan_den_tep), id(plan_vecer_tep)};
                static const char *const MENA[4] = {"Noc", "Ráno", "Deň", "Večer"};
                int teraz = time.hour * 60 + time.minute;
                int akt = -1, akt_m = -1, posl = 0, posl_m = -1;
                for (int k = 0; k < 4; k++) {
                  int m = zac[k]->hour * 60 + zac[k]->minute;
                  if (m <= teraz && m > akt_m) { akt = k; akt_m = m; }
                  if (m > posl_m) { posl = k; posl_m = m; }
                }
                if (akt < 0) akt = posl;
                ciel = tep[akt]->state;
                zapnutie = ciel - id(plan_hysterezia).state;
                pasmo = MENA[akt];
              } else {
                ciel = id(user_cielova_teplota).state;
                zapnutie = id(user_teplota_zapnutia).state;
                pasmo = id(plan_aktivny).state ? "Pevná (bez času)" : "Pevná";
              }
              if (id(izba_aktualny_ciel) != ciel) {
                id(izba_aktualny_ciel) = ciel;
                ESP_LOGI("izba", "Pásmo %s - cieľová teplota izby %.1f °C (zapnutie %.1f °C)", pasmo, ciel, zapnutie);
                id(izba_ciel_sensor).update();
              }
              char prefix[40];
              snprintf(prefix, sizeof(prefix), "[%s %.1f °C] ", pasmo, ciel);

              // Stav regulácie pre HA - publikuje sa len pri zmene textu
              auto stav = [&](const std::string &s) {
                std::string t = std::string(prefix) + s;
                if (id(izba_stav).get_state() != t) id(izba_stav).publish_state(t);
              };
              char buf[160];

              if (rezim == 0) { stav("Vypnutá - izba sa ignoruje"); return; }

              // HA posiela hodnotu len pri ZMENE - stála teplota neznamená výpadok.
              // Výpadok = HA odpojený, entita unavailable/unknown (NaN), alebo
              // 12 h bez jedinej zmeny (posledná záchrana, ak HA drží starú hodnotu).
              const uint32_t MAX_VEK_MS = 12UL * 60UL * 60UL * 1000UL;   // 12 hodín
              auto *zdroj = id(riadiaca_zdroj);
              float izba_t = zdroj != nullptr ? zdroj->state : NAN;
              bool cerstva = !isnan(izba_t) && api::global_api_server->is_connected() &&
                             id(riadiaca_posledna_aktualizacia) != 0 &&
                             (millis() - id(riadiaca_posledna_aktualizacia)) < MAX_VEK_MS;

              // Poistka reaguje až na výpadok dlhší ako 5 min (aj po štarte ESP),
              // krátke výpadky senzora/HA nemenia nič - posun sa len drží.
              const uint32_t VYPADOK_MS = 5UL * 60UL * 1000UL;
              static uint32_t nedostupna_od = 0;
              if (cerstva) {
                nedostupna_od = 0;
              } else if (nedostupna_od == 0) {
                nedostupna_od = millis();
              }
              if (!cerstva && (millis() - nedostupna_od) < VYPADOK_MS) {
                snprintf(buf, sizeof(buf), "Čakám na teplotu z izby (%u s) - stav sa drží",
                         (unsigned) ((millis() - nedostupna_od) / 1000));
                stav(buf);
                return;
              }
              // odtiaľto !cerstva znamená skutočný výpadok dlhší ako 5 min

              if (cerstva && zapnutie >= ciel) {
                ESP_LOGW("izba", "Teplota zapnutia (%.1f) musí byť nižšia ako cieľová (%.1f) - regulácia vynechaná", zapnutie, ciel);
                stav("Chyba nastavenia: teplota zapnutia >= cieľová");
                return;
              }

              if (rezim == 1) {
                // ---- REŽIM: POSUN EKVITERMICKEJ KRIVKY (0x4248) ----
                // Posun = okamžitá časť + pomalé doťahovanie:
                //  - okamžitá: -Zosilnenie × (izba - cieľ), iba keď je izba nad cieľom,
                //  - doťahovanie: každých 30 min -0,5 °C, ak je izba > cieľ + 0,2,
                //    a +0,5 °C, ak je izba < cieľ - 0,2. Vďaka nemu sa izba ustáli presne na cieli.
                // Výsledok zaokrúhlený na 0,5 °C, v rozsahu "Maximálny posun krivky" (napr. -5)
                // až "Maximálny kladný posun" (napr. +2) - kladný posun = teplejšia voda, keď je izba
                // dlhšie pod cieľom. Pri teplote zapnutia a nižšej sa záporný posun hneď zruší.
                // Pri výpadku senzora sa všetko vráti na 0.
                const uint32_t MIN_ODSTUP_MS = 10UL * 60UL * 1000UL;  // max. 1 zmena za 10 min
                const uint32_t KROK_MS = 30UL * 60UL * 1000UL;         // krok doťahovania
                float aktualny = id(wl_posun).state;
                float max_posun = id(posun_pri_prehriati).state;      // záporné číslo, napr. -5
                float max_plus = id(posun_kladny_max).state;           // kladné číslo, napr. +2
                float novy = NAN;
                std::string sprava;

                if (!cerstva) {
                  novy = 0.0f;   // poistka: bez údajov z izby normálna krivka
                  id(posun_i) = 0.0f;
                  sprava = "Senzor nedostupný - normálna krivka (poistka)";
                } else {
                  float p = izba_t > ciel ? -id(posun_zosilnenie).state * (izba_t - ciel) : 0.0f;
                  // prvý beh: doťahovanie nadviaže na aktuálny posun (bez skoku)
                  if (isnan(id(posun_i)))
                    id(posun_i) = isnan(aktualny) ? 0.0f : std::min(max_plus, std::max(max_posun, aktualny - p));
                  // Doťahovanie:
                  //  - izba na OPAČNEJ strane cieľa než doťahovanie (pod cieľom a voda znížená,
                  //    alebo nad cieľom a voda zvýšená) -> rýchly návrat k 0: 1,0 °C každých 10 min,
                  //  - inak pomalé doťahovanie 0,5 °C každých 30 min (mimo pásma cieľ ±0,2 °C).
                  const uint32_t RYCHLO_MS = 10UL * 60UL * 1000UL;
                  float vonku = id(vonk_teplota).state;
                  float leto = id(fsv_4013).state;
                  bool tuv_ide = id(ventil_3c).state.find("DHW") != std::string::npos;
                  bool kuri = kurenie_on && !id(bolo_vypnute_blokovanim) && !tuv_ide &&
                              !(!isnan(vonku) && !isnan(leto) && vonku > leto);
                  if (izba_t <= zapnutie && id(posun_i) < 0.0f) id(posun_i) = 0.0f;   // chladno: hneď
                  if (id(posun_i_cas) == 0) id(posun_i_cas) = millis();
                  uint32_t od_kroku = millis() - id(posun_i_cas);
                  bool proti = (izba_t < ciel && id(posun_i) < 0.0f) || (izba_t > ciel && id(posun_i) > 0.0f);
                  if (proti && od_kroku >= RYCHLO_MS) {
                    id(posun_i_cas) = millis();
                    float pred = id(posun_i);
                    id(posun_i) = pred < 0.0f ? std::min(0.0f, pred + 1.0f) : std::max(0.0f, pred - 1.0f);
                    ESP_LOGI("izba", "Riadiaca izba %.1f °C na opačnej strane cieľa - doťahovanie %.1f -> %.1f", izba_t, pred, id(posun_i));
                  } else if (!proti && od_kroku >= KROK_MS) {
                    id(posun_i_cas) = millis();
                    // Pomalé doťahovanie OD nuly len keď TČ skutočne kúri - inak by sa počas
                    // tarify, ohrevu TÚV, vypnutého kúrenia alebo letného vypnutia (FSV 4013)
                    // zbytočne nabalilo (izba chladne, lebo sa nekúri, nie pre slabú krivku).
                    if (kuri) {
                      if (izba_t > ciel + 0.2f) id(posun_i) -= 0.5f;
                      else if (izba_t < ciel - 0.2f) id(posun_i) += 0.5f;
                    }
                  }
                  id(posun_i) = std::min(max_plus, std::max(max_posun, id(posun_i)));
                  float spolu = roundf((p + id(posun_i)) * 2.0f) / 2.0f;
                  novy = std::min(max_plus, std::max(max_posun, spolu));
                  const char *kde = izba_t > ciel + 0.2f ? "Nad cieľom" : (izba_t < ciel - 0.2f ? "Pod cieľom" : "Na cieli");
                  snprintf(buf, sizeof(buf), "%s %.1f °C - posun %.1f (okamžitý %.1f, doťahovanie %.1f%s)",
                           kde, izba_t, novy, p, id(posun_i), kuri ? "" : ", pozastavené");
                  sprava = buf;
                }

                // ---- HYBRID: posun na maxime nestačí -> dočasne vypnúť kúrenie ----
                // Vypne, keď je posun na maxime a izba >= cieľ + "Hybrid: vypnúť pri prekročení".
                // Zapne, keď izba klesne pod cieľ. Platí min. chod/pauza a drahá tarifa má prednosť.
                float hyb = id(hybrid_prekrocenie).state;   // 0 = hybrid vypnutý
                if (hyb > 0.0f && !id(bolo_vypnute_blokovanim)) {
                  uint32_t od_zmeny_min = id(kurenie_posledna_zmena) == 0 ? UINT32_MAX
                                          : (millis() - id(kurenie_posledna_zmena)) / 60000UL;
                  uint32_t min_chod  = (uint32_t) id(min_chod_kurenia).state;
                  uint32_t min_pauza = (uint32_t) id(min_pauza_kurenia).state;
                  bool na_maxime = !isnan(aktualny) && aktualny <= max_posun + 0.05f;

                  if (!cerstva) {
                    if (id(regulacia_vypla_kurenie)) {
                      ESP_LOGW("izba", "Hybrid: izbová teplota nedostupná - zapínam kúrenie (poistka)");
                      id(regulacia_vypla_kurenie) = false;
                      id(sw_kurenie).turn_on();
                    }
                  } else if (kurenie_on && na_maxime && izba_t >= ciel + hyb) {
                    if (od_zmeny_min >= min_chod) {
                      ESP_LOGI("izba", "Hybrid: posun na maxime, riadiaca izba %.1f °C - vypínam kúrenie", izba_t);
                      id(regulacia_vypla_kurenie) = true;
                      id(sw_kurenie).turn_off();
                      snprintf(buf, sizeof(buf), "Hybrid: prehriate %.1f °C - kúrenie vypnuté", izba_t);
                    } else {
                      snprintf(buf, sizeof(buf), "Hybrid: prehriate %.1f °C - čaká na min. chod %u/%u min",
                               izba_t, (unsigned) od_zmeny_min, (unsigned) min_chod);
                    }
                    sprava = buf;
                  } else if (!kurenie_on && id(regulacia_vypla_kurenie)) {
                    if (izba_t >= ciel) {
                      snprintf(buf, sizeof(buf), "Hybrid: kúrenie vypnuté (%.1f °C)", izba_t);
                    } else if (od_zmeny_min >= min_pauza) {
                      ESP_LOGI("izba", "Hybrid: riadiaca izba %.1f °C pod cieľom - zapínam kúrenie", izba_t);
                      id(regulacia_vypla_kurenie) = false;
                      id(sw_kurenie).turn_on();
                      snprintf(buf, sizeof(buf), "Hybrid: %.1f °C pod cieľom - kúrenie zapnuté", izba_t);
                    } else {
                      snprintf(buf, sizeof(buf), "Hybrid: %.1f °C - čaká na min. pauzu %u/%u min",
                               izba_t, (unsigned) od_zmeny_min, (unsigned) min_pauza);
                    }
                    sprava = buf;
                  }
                }
                stav(sprava);

                bool zmena = !isnan(novy) && !isnan(aktualny) && fabsf(aktualny - novy) > 0.05f;
                // Návrat na 0 (chladno / poistka) ide hneď, ostatné zmeny najviac raz za 10 min
                bool smie = novy == 0.0f || id(posun_posledny_zapis) == 0 ||
                            (millis() - id(posun_posledny_zapis)) >= MIN_ODSTUP_MS;
                if (zmena && smie) {
                  ESP_LOGI("izba", "Riadiaca izba %.1f °C -> posun krivky %.1f -> %.1f °C", izba_t, aktualny, novy);
                  // zápis poistky neblokuje návrat regulácie 10-min limitom
                  if (cerstva) id(posun_posledny_zapis) = millis();
                  auto call = id(wl_posun).make_call();
                  call.set_value(novy);
                  call.perform();
                }
                return;
              }

              // ---- REŽIM: VYPÍNANIE KÚRENIA (0x4000) ----
              if (id(bolo_vypnute_blokovanim)) { stav("Drahá tarifa - rozhoduje tarifa"); return; }

              if (!cerstva) {
                // poistka: senzor nedodáva údaje -> nikdy nezostať bez kúrenia
                if (id(regulacia_vypla_kurenie)) {
                  ESP_LOGW("izba", "Izbová teplota nedostupná/stará - zapínam kúrenie (poistka)");
                  id(regulacia_vypla_kurenie) = false;
                  id(sw_kurenie).turn_on();
                }
                stav("Senzor nedostupný - kúrenie zapnuté (poistka)");
                return;
              }

              uint32_t od_zmeny_min = id(kurenie_posledna_zmena) == 0 ? UINT32_MAX
                                      : (millis() - id(kurenie_posledna_zmena)) / 60000UL;
              uint32_t min_chod  = (uint32_t) id(min_chod_kurenia).state;
              uint32_t min_pauza = (uint32_t) id(min_pauza_kurenia).state;

              if (kurenie_on && izba_t >= ciel) {
                if (od_zmeny_min >= min_chod) {
                  ESP_LOGI("izba", "Riadiaca izba %.1f °C >= %.1f °C - vypínam kúrenie", izba_t, ciel);
                  id(regulacia_vypla_kurenie) = true;
                  id(sw_kurenie).turn_off();
                  snprintf(buf, sizeof(buf), "Prehriate %.1f °C - kúrenie vypnuté", izba_t);
                } else {
                  snprintf(buf, sizeof(buf), "Prehriate %.1f °C - čaká na min. chod %u/%u min",
                           izba_t, (unsigned) od_zmeny_min, (unsigned) min_chod);
                }
              } else if (!kurenie_on && id(regulacia_vypla_kurenie)) {
                if (izba_t > zapnutie) {
                  snprintf(buf, sizeof(buf), "Kúrenie vypnuté reguláciou (%.1f °C)", izba_t);
                } else if (od_zmeny_min >= min_pauza) {
                  ESP_LOGI("izba", "Riadiaca izba %.1f °C <= %.1f °C - zapínam kúrenie", izba_t, zapnutie);
                  id(regulacia_vypla_kurenie) = false;
                  id(sw_kurenie).turn_on();
                  snprintf(buf, sizeof(buf), "Chladno %.1f °C - kúrenie zapnuté", izba_t);
                } else {
                  snprintf(buf, sizeof(buf), "Chladno %.1f °C - čaká na min. pauzu %u/%u min",
                           izba_t, (unsigned) od_zmeny_min, (unsigned) min_pauza);
                }
              } else if (!kurenie_on) {
                snprintf(buf, sizeof(buf), "Kúrenie vypnuté ručne (%.1f °C)", izba_t);
              } else {
                snprintf(buf, sizeof(buf), "Kúrenie beží (%.1f °C)", izba_t);
              }
              stav(buf);

  # FSV body krivky - TČ ich neposiela sama, čítajú sa na požiadanie
  - interval: 30min
